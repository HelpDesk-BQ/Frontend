<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/assets/elo-icon.svg" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000"
    />
    <title>Chamados — Elo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300..700&family=JetBrains+Mono:wght@300..600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="app">
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="sidebar is-dark" id="sidebar" aria-label="Navegação do sistema">
        <a class="sidebar__brand" href="/screens/dashboard.html"><img src="/assets/elo-logo-white.svg" alt="Elo — início" width="68" height="24" /></a>
        <nav class="sidebar__nav" aria-label="Principal">
          <a class="sidebar__link" href="/screens/dashboard.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h4.5v4.5h-4.5zM9 2.5h4.5v3H9zM9 7.5h4.5v6H9zM2.5 9h4.5v4.5h-4.5z"/></svg><span data-label-requester="Início">Dashboard</span></a>
          <a class="sidebar__link" href="/screens/tickets.html" aria-current="page"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 9.5h3l1 2h4l1-2h3"/><path d="M2 9.5 4 3h8l2 6.5V13H2z"/></svg><span data-label-requester="Meus chamados">Chamados</span><span class="sidebar__count" data-shell-count hidden></span></a>
        </nav>
        <div class="sidebar__user">
          <span class="sidebar__avatar" data-shell-initials aria-hidden="true"></span>
          <span class="sidebar__who"><strong data-shell-name>…</strong><small data-shell-email></small><small data-shell-role></small></span>
          <a class="sidebar__logout" href="/screens/login.html" data-action="logout" aria-label="Sair" title="Sair"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2H4v12h5M6.5 8H14m0 0-2.5-2.5M14 8l-2.5 2.5"/></svg></a>
        </div>
      </aside>
      <div class="app-main">
        <header class="app-top">
          <button class="app-top__menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu" hidden><span></span></button>
          <a class="app-top__brand" href="/screens/dashboard.html"><img src="/assets/elo-logo.svg" alt="Elo — início" width="62" height="22" /></a>
          <nav aria-label="Você está em"><ol class="crumbs"><li><a href="/screens/dashboard.html">Elo</a></li><li aria-current="page" data-label-requester="Meus chamados">Chamados</li></ol></nav>
          <div class="app-top__actions">
            <a class="btn btn--primary btn--small" href="/screens/novo.html" data-requires="requester" hidden><svg class="btn__icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>Novo chamado</a>
          </div>
        </header>
        <main id="main" class="app-content">
          <header class="page-head">
            <div>
              <p class="eyebrow">Fila</p>
              <h1 data-label-requester="Meus chamados">Chamados</h1>
              <p class="page-head__lead" id="list-lead"></p>
            </div>
          </header>
          <form id="filters" class="list-toolbar" aria-label="Filtros">
            <div class="tabs" id="status-tabs" role="group" aria-label="Filtrar por estado">
              <button class="tab" type="button" data-status="" aria-pressed="true">Todos <span class="tab__count" data-count-for="all"></span></button>
              <button class="tab" type="button" data-status="open" aria-pressed="false">Abertos <span class="tab__count" data-count-for="open"></span></button>
              <button class="tab" type="button" data-status="analysis" aria-pressed="false">Em análise <span class="tab__count" data-count-for="analysis"></span></button>
              <button class="tab" type="button" data-status="in_progress" aria-pressed="false">Em atendimento <span class="tab__count" data-count-for="in_progress"></span></button>
              <button class="tab" type="button" data-status="resolved" aria-pressed="false">Resolvidos <span class="tab__count" data-count-for="resolved"></span></button>
              <button class="tab" type="button" data-status="closed" aria-pressed="false">Fechados <span class="tab__count" data-count-for="closed"></span></button>
            </div>
            <div class="list-filters">
              <div class="field field--inline">
                <label for="priority">Prioridade</label>
                <select id="priority" name="priority">
                  <option value="">Todas</option>
                  <option value="low">Baixa</option>
                  <option value="medium">Média</option>
                  <option value="high">Alta</option>
                  <option value="critical">Crítica</option>
                </select>
              </div>
              <button id="reset-filters" class="btn btn--ghost btn--small" type="button" data-testid="filter-reset" hidden><svg class="btn__icon" aria-hidden="true"><use href="/assets/icons.svg#i-x"/></svg>Limpar filtros</button>
            </div>
          </form>
          <div id="state-loading" class="skeleton-list" hidden>
            <p class="sr-only" role="status">Carregando chamados…</p>
            <span class="skeleton skel-line" aria-hidden="true"></span>
            <span class="skeleton skel-line" aria-hidden="true"></span>
            <span class="skeleton skel-line" aria-hidden="true"></span>
            <span class="skeleton skel-line" aria-hidden="true"></span>
            <span class="skeleton skel-line" aria-hidden="true"></span>
          </div>
          <div id="state-error" class="form-error" hidden></div>
          <div id="list-empty" hidden></div>
          <div id="list-wrap" class="table-wrap" hidden>
            <table class="tickets">
              <thead>
                <tr>
                  <th scope="col">Chamado</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Prioridade</th>
                  <th scope="col">Atualizado</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pager" id="pager" hidden>
            <button id="prev" class="btn btn--secondary btn--small" type="button"><svg class="btn__icon" aria-hidden="true"><use href="/assets/icons.svg#i-chevron-left"/></svg>Anterior</button>
            <span id="page-info"></span>
            <button id="next" class="btn btn--secondary btn--small" type="button">Próxima<svg class="btn__icon" aria-hidden="true"><use href="/assets/icons.svg#i-chevron-right"/></svg></button>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/js/pages/tickets.js"></script>
  </body>
</html>
