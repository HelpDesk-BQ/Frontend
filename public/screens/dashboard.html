<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%23d04841'/%3E%3C/svg%3E" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://localhost:3000"
    />
    <title>Dashboard — HelpDesk BQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>
    <header class="topnav">
      <div class="container topnav__inner">
        <a class="topnav__brand" href="/screens/tickets.html">HelpDesk BQ</a>
        <nav class="topnav__links" aria-label="Principal">
          <a href="/screens/tickets.html">Chamados</a>
          <a href="/screens/novo.html">Novo chamado</a>
          <a href="/screens/dashboard.html" aria-current="page">Dashboard</a>
          <a href="/screens/login.html" class="logout-link" data-action="logout"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2H4v12h5M6 8h7m0 0-2-2m2 2-2 2"/></svg>Sair</a>
        </nav>
      </div>
    </header>
    <main id="main" class="page">
      <div class="container">
        <p class="eyebrow">Totais</p>
        <h1>Dashboard</h1>
        <form id="filters" class="toolbar" aria-label="Filtros do resumo">
          <div class="field">
            <label for="status">Estado</label>
            <select id="status" name="status">
              <option value="">Todos</option>
              <option value="open">Aberto</option>
              <option value="analysis">Em análise</option>
              <option value="in_progress">Em atendimento</option>
              <option value="resolved">Resolvido</option>
              <option value="closed">Fechado</option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Prioridade</label>
            <select id="priority" name="priority">
              <option value="">Todas</option>
              <option value="low">Baixa</option>
              <option value="medium">Média</option>
              <option value="high">Alta</option>
              <option value="critical">Crítica</option>
            </select>
          </div>
          <button id="reset-filters" class="btn btn--ghost" type="button" hidden>Remover filtros</button>
        </form>
        <div id="state-error" class="form-error" hidden></div>
        <div id="summary" hidden>
          <div class="stats" id="status-stats"></div>
          <h2>Por prioridade</h2>
          <div class="stats" id="priority-stats"></div>
          <h2>Chamados recentes</h2>
          <div class="table-wrap">
            <table class="tickets">
              <thead>
                <tr>
                  <th scope="col">Título</th>
                  <th scope="col">Estado</th>
                  <th scope="col">Prioridade</th>
                </tr>
              </thead>
              <tbody id="recent-rows"></tbody>
            </table>
          </div>
          <p><a class="btn btn--ghost" href="/screens/tickets.html">Ver todos os chamados</a></p>
        </div>
        <div id="summary-empty" hidden></div>
      </div>
    </main>
    <script type="module" src="/js/pages/dashboard.js"></script>
  </body>
</html>
