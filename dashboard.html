<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel — HelpDesk BQ</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">HelpDesk BQ<small>Operação Software Confiável</small></a>
      <nav class="site-nav" aria-label="Navegação principal" data-app-nav>
        <a href="index.html" data-nav="home">Início</a>
        <a href="dashboard.html" data-nav="dashboard">Painel</a>
        <a href="tickets.html" data-nav="tickets">Chamados</a>
      </nav>
      <div class="header-meta">
        <span data-user-slot></span>
        <button class="btn btn-secondary" type="button" data-logout>Sair</button>
      </div>
    </div>
  </header>

  <main class="container" id="conteudo">
    <section class="hero prose">
      <p class="eyebrow">Painel</p>
      <h1>O estado da fila.</h1>
      <p class="lede">Números reais da API. Solicitantes veem só os próprios chamados.</p>
    </section>

    <section class="section" aria-label="Filtros do resumo">
      <form class="filter-row" onsubmit="return false">
        <div class="field">
          <label for="report-status">Estado</label>
          <select id="report-status" class="select"></select>
        </div>
        <div class="field">
          <label for="report-priority">Prioridade</label>
          <select id="report-priority" class="select"></select>
        </div>
      </form>
    </section>

    <section class="section section--narrow" aria-label="Resumo">
      <h2>Total</h2>
      <p id="report-total" class="stat-number" aria-live="polite">…</p>
      <h2>Por estado</h2>
      <ul id="report-by-status" class="meter-list"></ul>
      <h2>Por prioridade</h2>
      <ul id="report-by-priority" class="meter-list"></ul>
    </section>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module">
    import { initDashboardPage } from './js/pages/dashboard.js';
    initDashboardPage();
  </script>
</body>
</html>
