<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chamados — HelpDesk BQ</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">HelpDesk BQ<small>Operação Software Confiável</small></a>
      <nav class="site-nav" aria-label="Navegação principal" data-app-nav>
        <a href="index.html" data-nav="home">Início</a>
        <a href="dashboard.html" data-nav="dashboard">Painel</a>
        <a href="tickets.html" data-nav="tickets">Chamados</a>
      </nav>
      <div class="header-meta">
        <span data-user-slot></span>
        <span class="badge" data-api-status data-state="checking">Verificando API…</span>
        <button class="btn btn-secondary" type="button" data-logout>Sair</button>
      </div>
    </div>
  </header>

  <main class="container" id="conteudo">
    <section class="hero prose">
      <p class="eyebrow">Chamados</p>
      <h1>A fila, sem ruído.</h1>
      <p class="lede">Filtre por estado e prioridade. Solicitantes veem só os próprios chamados.</p>
      <p><a class="btn btn-primary" href="ticket-new.html" style="text-decoration:none;display:inline-block">Abrir chamado</a></p>
    </section>

    <section class="section" aria-label="Filtros">
      <form class="filter-row" onsubmit="return false">
        <div class="field">
          <label for="filter-status">Estado</label>
          <select id="filter-status" class="select"></select>
        </div>
        <div class="field">
          <label for="filter-priority">Prioridade</label>
          <select id="filter-priority" class="select"></select>
        </div>
      </form>
      <p id="ticket-meta" class="small muted" aria-live="polite"></p>
    </section>

    <section class="section" aria-label="Lista de chamados">
      <ul id="ticket-list" class="ticket-list"></ul>
      <nav class="pagination" aria-label="Paginação">
        <button id="page-prev" class="btn btn-secondary" type="button">Anterior</button>
        <span id="page-info" class="small muted" aria-live="polite"></span>
        <button id="page-next" class="btn btn-secondary" type="button">Próxima</button>
      </nav>
    </section>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module">
    import { initTicketsPage } from './js/pages/tickets.js';
    initTicketsPage();
  </script>
</body>
</html>
